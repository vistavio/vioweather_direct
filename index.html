<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>VioWeather</title>
<style>
  :root { color-scheme: light dark; --bg: #F4F7FB; --card: #FFFFFF; --fg: #1B2B48; --muted: #5D6B82; --accent: #1E6FD9; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0F1726; --card: #1A2436; --fg: #E8EEF7; --muted: #A3B1C6; --accent: #6AA8FF; } }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); color: var(--fg);
         font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 24px 16px; box-sizing: border-box; }
  main { max-width: 420px; width: 100%; background: var(--card); border-radius: 20px; padding: 28px 24px; text-align: center;
         box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08); }
  h1 { margin: 0 0 8px; font-size: 1.6rem; }
  p { margin: 8px 0; color: var(--muted); line-height: 1.5; }
  .btn { display: block; margin: 16px auto 0; padding: 12px 20px; border-radius: 999px; background: var(--accent); color: #FFFFFF;
         text-decoration: none; font-weight: 700; max-width: 280px; }
  .soon { margin-top: 16px; font-weight: 600; color: var(--fg); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>VioWeather</h1>
  <p id="lead"></p>
  <a id="play" class="btn" href="#"></a>
  <p id="ios" class="soon" hidden></p>
</main>
<script>
// One link for every phone (shared from the app): Android goes on to Google
// Play with the campaign (?c=...) as the install referrer; iPhone gets the
// App Store once there is one (APP_STORE_URL), until then a "coming soon"
// line; anything else sees the buttons.
(function () {
  var APP_STORE_URL = ''; // e.g. 'https://apps.apple.com/app/id0000000000' when the iPhone app is out

  var T = {
    tr: ['Hava durumu ve alarm uyarıları', "Google Play'den indir", 'Google Play açılıyor…', 'iPhone için çok yakında.', "App Store'dan indir"],
    en: ['Weather and alerts', 'Get it on Google Play', 'Opening Google Play…', 'Coming soon for iPhone.', 'Download on the App Store'],
    de: ['Wetter und Warnungen', 'Bei Google Play laden', 'Google Play wird geöffnet…', 'Bald auch für das iPhone.', 'Im App Store laden'],
    fr: ['Météo et alertes', 'Disponible sur Google Play', 'Ouverture de Google Play…', "Bientôt sur iPhone.", "Télécharger dans l'App Store"],
    zh: ['天气与预警', '在 Google Play 下载', '正在打开 Google Play…', 'iPhone 版即将推出。', '在 App Store 下载'],
    es: ['El tiempo y avisos', 'Disponible en Google Play', 'Abriendo Google Play…', 'Muy pronto para iPhone.', 'Descargar en el App Store'],
    it: ['Meteo e allerte', 'Disponibile su Google Play', 'Apertura di Google Play…', 'Presto anche per iPhone.', "Scarica dall'App Store"],
    ru: ['Погода и предупреждения', 'Скачать в Google Play', 'Открываем Google Play…', 'Скоро для iPhone.', 'Загрузить в App Store'],
    ja: ['天気と警報', 'Google Play で手に入れよう', 'Google Play を開いています…', 'iPhone 版はまもなく登場。', 'App Store からダウンロード'],
    ko: ['날씨와 경보', 'Google Play에서 받기', 'Google Play를 여는 중…', 'iPhone 버전 곧 출시.', 'App Store에서 다운로드']
  };
  var lang = (navigator.language || 'en').slice(0, 2).toLowerCase();
  var t = T[lang] || T.en;
  document.documentElement.lang = T[lang] ? lang : 'en';

  // Only a plain campaign name passes on (letters, digits, _).
  var m = /[?&]c=([A-Za-z0-9_]{1,40})/.exec(location.search);
  var campaign = m ? m[1] : 'link';
  var play = 'https://play.google.com/store/apps/details?id=com.vistavio.weather&referrer=' +
    encodeURIComponent('utm_source=app_share&utm_medium=share&utm_campaign=' + campaign);

  var ua = navigator.userAgent || '';
  var android = /Android/i.test(ua);
  var ios = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  var lead = document.getElementById('lead');
  var playBtn = document.getElementById('play');
  var iosLine = document.getElementById('ios');
  lead.textContent = t[0];
  playBtn.href = play;
  playBtn.textContent = t[1];

  if (android) {
    lead.textContent = t[2];
    location.replace(play);
  } else if (ios) {
    if (APP_STORE_URL) {
      // ct: the App Store Connect campaign (its provider token pt can be added to the URL above).
      location.replace(APP_STORE_URL + '?ct=' + campaign);
    } else {
      playBtn.hidden = true;
      iosLine.hidden = false;
      iosLine.textContent = t[3];
    }
  } else {
    iosLine.hidden = false;
    if (APP_STORE_URL) {
      iosLine.innerHTML = '';
      var a = document.createElement('a');
      a.className = 'btn';
      a.href = APP_STORE_URL + '?ct=' + campaign;
      a.textContent = t[4];
      iosLine.appendChild(a);
    } else {
      iosLine.textContent = t[3];
    }
  }
})();
</script>
</body>
</html>
